const $=id=>document.getElementById(id),now=new Date(),S={y:now.getFullYear(),m:now.getMonth()},colors=['#435fd4','#18845c','#a044b4','#bb6b18','#117f91','#c7445c','#606ba0','#527e2b'];
const iso=d=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10),parts=s=>s.replaceAll('，',',').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean),off=s=>parts(s).map(x=>x.toLowerCase()),val=(d,a,p)=>{if(!a||!p.length)return'';let n=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)-new Date(a+'T12:00:00'))/86400000);return p[((n%p.length)+p.length)%p.length]},esc=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000);

$('aa').value=iso(now);$('week').innerHTML='일월화수목금토'.split('').map(x=>'<div class="weekday">'+x+'</div>').join('');let people=[];
function personHTML(p,i){let n=i+2;return '<section class="person-card"><div class="person-heading"><b class="small">● '+n+'번째 사람</b><button class="remove-person" type="button" data-remove="'+i+'">삭제</button></div><label>이름</label><input class="person-name" data-i="'+i+'" value="'+esc(p.name)+'"><label>반복 패턴</label><input class="person-pattern" data-i="'+i+'" value="'+esc(p.pattern)+'"><div class="row"><div><label>패턴 첫날</label><input class="person-start" data-i="'+i+'" type="date" value="'+esc(p.start)+'"></div><div><label>휴무 표기</label><input class="person-off" data-i="'+i+'" value="'+esc(p.off)+'"></div></div></section>'}
function renderPeople(){ $('peopleList').innerHTML=people.map(personHTML).join('');$('addPerson').disabled=people.length>=7;$('addPerson').textContent=people.length>=7?'최대 8명까지 비교할 수 있어요':'＋ 사람 추가';document.querySelectorAll('#peopleList input').forEach(el=>el.oninput=()=>{let i=+el.dataset.i,k=el.className==='person-name'?'name':el.className==='person-pattern'?'pattern':el.className==='person-start'?'start':'off';people[i][k]=el.value;draw()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{people.splice(+b.dataset.remove,1);renderPeople();draw()})}
function allPeople(){return [{name:$('na').value.trim()||'첫 번째 사람',pattern:$('pa').value,start:$('aa').value,off:$('oa').value},...people]}
function draw(){let all=allPeople(),cmp=$('cmp').checked;$('peopleCompare').classList.toggle('hide',!cmp);$('overlap').classList.toggle('hide',!cmp);$('title').textContent=S.y+'년 '+(S.m+1)+'월';$('legend').innerHTML=all.map((p,i)=>'<span class="legend-item"><i style="background:'+colors[i]+'"></i>'+esc(p.name||((i+1)+'번째 사람'))+'</span>').join('')+(cmp?'<span class="legend-item"><i class="legend-together"></i>모두 휴무</span>':'');let first=new Date(S.y,S.m,1),d0=new Date(S.y,S.m,1-first.getDay()),html='',sameDays=[];for(let i=0;i<42;i++){let d=new Date(d0);d.setDate(d0.getDate()+i);let shifts=all.map(p=>val(d,p.start,parts(p.pattern))),together=d.getMonth()===S.m&&cmp&&all.length>1&&all.every((p,j)=>off(p.off).includes(shifts[j].toLowerCase()));if(together)sameDays.push(d);html+='<div class="day '+(d.getMonth()===S.m?'':'out')+(d.toDateString()===now.toDateString()?' today':'')+(together?' over':'')+'"><span class="num">'+d.getDate()+'</span>'+(together?'<span class="tag">모두 쉼</span>':'')+shifts.map((v,j)=>'<div class="shift p'+j+'" title="'+esc(all[j].name)+': '+esc(v)+'">'+esc(v)+'</div>').join('')+'</div>'}$('days').innerHTML=html;let work=Array.from({length:new Date(S.y,S.m+1,0).getDate()},(_,i)=>val(new Date(S.y,S.m,i+1),$('aa').value,parts($('pa').value))).filter(x=>x&&!off($('oa').value).includes(x.toLowerCase())).length;$('summary').textContent=(S.m+1)+'월 '+esc(all[0].name)+' 근무일 '+work+'일 · 패턴 첫날을 확인하세요.';if(cmp){$('count').textContent=sameDays.length+'일';$('dates').innerHTML=sameDays.length?sameDays.map(d=>'<span class="pill">'+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')</span>').join(''):'<span class="small">이번 달 모두 겹치는 휴무가 없습니다.</span>'}}
$('addPerson').onclick=()=>{if(people.length<7){people.push({name:(people.length+2)+'번째 사람',pattern:'주,주,야,야,비,비',start:$('aa').value,off:$('oa').value});renderPeople();draw()}};$('cmp').onchange=()=>{if($('cmp').checked&&!people.length){people.push({name:'두 번째 사람',pattern:'주,주,야,야,비,비',start:$('aa').value,off:$('oa').value});renderPeople()}draw()};['pa','aa','oa','na'].forEach(k=>$(k).oninput=draw);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('pa').value=b.dataset.p;draw()});$('prev').onclick=()=>{if(--S.m<0){S.m=11;S.y--}draw()};$('next').onclick=()=>{if(++S.m>11){S.m=0;S.y++}draw()};$('print').onclick=()=>print();
$('share').onclick=async()=>{let u=new URL(location.href);['pa','aa','oa','na'].forEach(k=>u.searchParams.set(k,$(k).value));u.searchParams.set('people',JSON.stringify(people));u.searchParams.set('cmp',$('cmp').checked?'1':'0');['pb','ab','ob'].forEach(k=>u.searchParams.delete(k));try{await navigator.clipboard.writeText(u.href);toast('링크를 복사했어요.')}catch(e){prompt('링크를 복사해 공유하세요',u.href)}};
$('img').onclick=()=>{let all=allPeople(),cmp=$('cmp').checked,c=document.createElement('canvas'),x=c.getContext('2d'),top=88,rh=20+all.length*16;c.width=980;c.height=top+6*rh+10;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#1b2942';x.font='bold 27px sans-serif';x.fillText('같이쉼 · '+S.y+'년 '+(S.m+1)+'월',25,40);'일월화수목금토'.split('').forEach((v,i)=>{x.font='bold 15px sans-serif';x.fillStyle=i===0?'#d14b4b':i===6?'#435fd4':'#526078';x.fillText(v,34+i*132,76)});let st=new Date(S.y,S.m,1-new Date(S.y,S.m,1).getDay());for(let i=0;i<42;i++){let d=new Date(st);d.setDate(st.getDate()+i);let sh=all.map(p=>val(d,p.start,parts(p.pattern))),ok=cmp&&all.length>1&&all.every((p,j)=>off(p.off).includes(sh[j].toLowerCase())),px=20+i%7*132,py=top+Math.floor(i/7)*rh;x.fillStyle=d.getMonth()===S.m?(ok?'#e1f6eb':'#f3f5fa'):'#fafafa';x.fillRect(px,py,124,rh-3);x.fillStyle=d.getDay()===0?'#d14b4b':d.getDay()===6?'#435fd4':'#526078';x.font='11px sans-serif';x.fillText(d.getDate(),px+5,py+13);sh.forEach((v,j)=>{x.fillStyle=colors[j];x.font='bold 10px sans-serif';x.fillText((all[j].name||('사람'+(j+1)))+': '+v,px+26,py+13+j*14)})}let a=document.createElement('a');a.download='같이쉼-'+all.length+'명.png';a.href=c.toDataURL();a.click()};
let q=new URLSearchParams(location.search);['pa','aa','oa','na'].forEach(k=>{if(q.has(k))$(k).value=q.get(k)});if(q.has('people')){try{let v=JSON.parse(q.get('people'));if(Array.isArray(v))people=v.slice(0,7)}catch(e){people=[]}}else if(q.has('pb'))people=[{name:'두 번째 사람',pattern:q.get('pb'),start:q.get('ab')||$('aa').value,off:q.get('ob')||$('oa').value}];if(q.get('cmp')==='1')$('cmp').checked=true;renderPeople();draw()
