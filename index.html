<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="교대근무 패턴으로 근무 달력을 만들고 두 사람의 휴무가 겹치는 날을 확인하세요."><title>같이쉼 | 교대근무 달력</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1b2942;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1000px;margin:auto;padding:18px}.brand{font-size:20px;font-weight:850}.brand b{background:#5975ed;color:white;padding:6px 10px;border-radius:10px;margin-right:7px}.hero{padding:22px 0}.hero h1{font-size:clamp(30px,5vw,44px);line-height:1.1;margin:7px 0;letter-spacing:-.05em}.muted{color:#738097}.layout{display:grid;grid-template-columns:285px 1fr;gap:14px;align-items:start}.card{background:white;border:1px solid #e3e8f0;border-radius:17px;padding:16px;box-shadow:0 10px 30px #1829480b}.settings{position:sticky;top:10px}.small{font-size:11px;color:#738097;line-height:1.5}label{display:block;font-size:12px;font-weight:750;margin:11px 0 5px}input{width:100%;height:38px;border:1px solid #d9dfeb;border-radius:9px;padding:0 8px;font:inherit;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chips,.actions,.tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}button{cursor:pointer}.chip,.tool,.nav,.secondary{border:1px solid #e1e6ef;background:white;color:#526078;border-radius:8px;padding:6px 8px;font-size:10px}.primary{width:100%;border:0;background:#5975ed;color:white;border-radius:9px;padding:10px;font-weight:750}.secondary{flex:1;padding:9px}.rule{height:1px;background:#e8ebf1;margin:13px 0}.toggle{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}.toggle input{width:17px;height:17px;accent-color:#5975ed}.hide{display:none!important}.right{display:grid;gap:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.month{display:flex;align-items:center;gap:7px}.month h2{font-size:20px;min-width:130px;margin:0}.nav{font-size:17px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;font-size:10px;color:#748097;padding:5px}.day{min-height:66px;border:1px solid #edf0f5;border-radius:8px;padding:5px 3px;position:relative}.day.out{background:#fafbfc;color:#b5bdca}.day.today{border:1px solid #718cf2}.day.over{background:#e1f6eb;border-color:#b7e5cd}.num{font-size:10px;font-weight:bold;color:#69758b}.shift{font-size:11px;font-weight:850;color:#435fd4;margin-top:6px;overflow:hidden;white-space:nowrap}.shift.b{font-size:9px;color:#18845c;margin-top:3px}.day.out .shift{opacity:.4}.tag{position:absolute;right:2px;top:2px;color:#228258;font-size:8px}.summary{background:#f7f8fb;border-radius:8px;padding:8px;font-size:10px;color:#657188;margin:9px 0 0}.badge{background:#e1f6eb;color:#177250;border-radius:99px;padding:4px 8px;font-size:10px}.overhead{display:flex;justify-content:space-between}.overhead h2{font-size:15px;margin:0}.dates{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.pill{border:1px solid #d5f0e1;background:#f1faf5;color:#17694c;border-radius:8px;padding:6px;font-size:10px}footer{padding:16px 0;font-size:10px;color:#8791a3}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#1b2942;color:white;padding:9px 13px;border-radius:9px;opacity:0}.toast.show{opacity:1}@media(max-width:750px){.layout{grid-template-columns:1fr}.settings{position:static}.head{align-items:flex-start;flex-direction:column}.day{min-height:57px}}@media(max-width:480px){.w{padding:11px}.card{padding:11px}.week,.days{gap:3px}.day{min-height:51px;padding:4px 2px}.weekday,.num{font-size:9px}.shift{font-size:9px}.shift.b{font-size:8px}.month h2{font-size:18px;min-width:118px}}@media print{.brand,.hero,.settings,.overlap,footer,.tools{display:none!important}.layout{display:block}.card{border:0;box-shadow:none}.day{min-height:85px}}</style><body><div class="w"><header class="brand"><b>✳</b>같이쉼</header><section class="hero"><small style="color:#5975ed;font-weight:800">SHIFT CALENDAR MAKER</small><h1>우리 둘의 쉬는 날,<br>한눈에 맞춰봐요.</h1><p class="muted">반복 패턴을 달력으로 만들고, 같이 쉴 수 있는 날을 찾아보세요.</p></section><main class="layout"><aside class="card settings"><h2>근무 패턴 설정</h2><p class="small">주기 첫날과 반복 순서를 입력하세요. 계산은 이 기기에서만 이루어져요.</p><b class="small">● 내 근무</b><label>반복 패턴</label><input id="pa" value="주,주,야,야,비,비"><small class="small">쉼표로 구분: 주,주,야,야,비,비</small><div class="chips"><button class="chip" data-p="주,주,야,야,비,비">주주야야비비</button><button class="chip" data-p="주,야,비,휴">주야비휴</button><button class="chip" data-p="D,E,N,휴">D·E·N·휴</button></div><div class="row"><div><label>패턴 첫날</label><input type="date" id="aa"></div><div><label>휴무 표기</label><input id="oa" value="비,휴,오프,OFF,O"></div></div><div class="rule"></div><label class="toggle">두 번째 사람 비교 <input type="checkbox" id="cmp"></label><section id="personB" class="hide"><div class="rule"></div><b class="small">● 두 번째 사람</b><label>반복 패턴</label><input id="pb" value="주,주,야,야,비,비"><div class="row"><div><label>패턴 첫날</label><input type="date" id="ab"></div><div><label>휴무 표기</label><input id="ob" value="비,휴,오프,OFF,O"></div></div></section><div class="actions"><button class="primary" id="share">일정 링크 공유</button><button class="secondary" id="img">달력 이미지 저장</button></div></aside><section class="right"><section class="card"><div class="head"><div class="month"><button class="nav" id="prev">‹</button><h2 id="title"></h2><button class="nav" id="next">›</button></div><div class="tools"><button class="tool" id="print">인쇄 / PDF</button></div></div><p class="small">파랑: 내 근무 · 초록: 상대 근무 · 연두: 둘 다 휴무</p><div class="week" id="week"></div><div class="days" id="days"></div><p class="summary" id="summary"></p></section><section class="card overlap hide" id="overlap"><div class="overhead"><h2>이번 달 같이 쉬는 날</h2><span class="badge" id="count"></span></div><div class="dates" id="dates"></div></section></section></main><footer>실제 근무표와 패턴 시작일을 확인해 주세요. 입력한 일정은 서버로 전송되지 않습니다.</footer></div><div class="toast" id="toast"></div><script>(()=>{const $=x=>document.getElementById(x),now=new Date(),S={y:now.getFullYear(),m:now.getMonth()},iso=d=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10),parts=s=>s.split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean),off=s=>parts(s).map(x=>x.toLowerCase()),val=(d,a,p)=>{if(!a||!p.length)return'';let n=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)-new Date(a+'T12:00:00'))/86400000);return p[((n%p.length)+p.length)%p.length]},toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)};$('aa').value=iso(now);$('ab').value=iso(now);$('week').innerHTML='일월화수목금토'.split('').map(x=>'<div class="weekday">'+x+'</div>').join('');function draw(){let pa=parts($('pa').value),pb=parts($('pb').value),oa=off($('oa').value),ob=off($('ob').value),c=$('cmp').checked;$('personB').classList.toggle('hide',!c);$('overlap').classList.toggle('hide',!c);$('title').textContent=S.y+'년 '+(S.m+1)+'월';let d0=new Date(S.y,S.m,1-new Date(S.y,S.m,1).getDay()),html='',both=[];for(let i=0;i<42;i++){let d=new Date(d0);d.setDate(d0.getDate()+i);let a=val(d,$('aa').value,pa),b=c?val(d,$('ab').value,pb):'',same=d.getMonth()===S.m&&c&&oa.includes(a.toLowerCase())&&ob.includes(b.toLowerCase());if(same)both.push(d);html+='<div class="day '+(d.getMonth()===S.m?'':'out')+(d.toDateString()===now.toDateString()?' today':'')+(same?' over':'')+'"><span class="num">'+d.getDate()+'</span>'+(same?'<span class="tag">함께 쉼</span>':'')+'<div class="shift">'+a+'</div>'+(c?'<div class="shift b">'+b+'</div>':'')+'</div>'}$('days').innerHTML=html;let n=Array.from({length:new Date(S.y,S.m+1,0).getDate()},(_,i)=>val(new Date(S.y,S.m,i+1),$('aa').value,pa)).filter(x=>x&&!oa.includes(x.toLowerCase())).length;$('summary').textContent=(S.m+1)+'월 근무일 '+n+'일 · 패턴 첫날을 확인하세요.';if(c){$('count').textContent=both.length+'일';$('dates').innerHTML=both.length?both.map(d=>'<span class="pill">'+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')</span>').join(''):'<span class="small">이번 달 겹치는 휴무가 없습니다.</span>'}}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('pa').value=b.dataset.p;draw()});$('cmp').onchange=draw;['pa','aa','oa','pb','ab','ob'].forEach(k=>$(k).oninput=draw);$('prev').onclick=()=>{if(--S.m<0){S.m=11;S.y--}draw()};$('next').onclick=()=>{if(++S.m>11){S.m=0;S.y++}draw()};$('print').onclick=()=>print();$('share').onclick=async()=>{let u=new URL(location.href);['pa','aa','oa','pb','ab','ob'].forEach(k=>u.searchParams.set(k,$(k).value));u.searchParams.set('cmp',$('cmp').checked?'1':'0');try{await navigator.clipboard.writeText(u.href);toast('링크를 복사했어요.')}catch(e){prompt('링크를 복사해 공유하세요',u.href)}};$('img').onclick=()=>{let c=document.createElement('canvas'),x=c.getContext('2d');c.width=980;c.height=660;x.fillStyle='#fff';x.fillRect(0,0,980,660);x.fillStyle='#1b2942';x.font='bold 27px sans-serif';x.fillText('같이쉼 · '+S.y+'년 '+(S.m+1)+'월',25,40);'일월화수목금토'.split('').forEach((v,i)=>{x.font='bold 15px sans-serif';x.fillText(v,34+i*132,76)});let st=new Date(S.y,S.m,1-new Date(S.y,S.m,1).getDay());for(let i=0;i<42;i++){let d=new Date(st);d.setDate(st.getDate()+i);let a=val(d,$('aa').value,parts($('pa').value)),b=$('cmp').checked?val(d,$('ab').value,parts($('pb').value)):'';let px=20+i%7*132,py=88+Math.floor(i/7)*80;x.fillStyle=d.getMonth()===S.m?'#f3f5fa':'#fafafa';x.fillRect(px,py,124,74);x.fillStyle='#526078';x.font='12px sans-serif';x.fillText(d.getDate(),px+6,py+17);x.fillStyle='#435fd4';x.font='bold 15px sans-serif';x.fillText(a,px+6,py+42);if(b){x.fillStyle='#18845c';x.font='bold 12px sans-serif';x.fillText(b,px+6,py+61)}}let a=document.createElement('a');a.download='같이쉼.png';a.href=c.toDataURL();a.click()};let q=new URLSearchParams(location.search);['pa','aa','oa','pb','ab','ob'].forEach(k=>{if(q.has(k))$(k).value=q.get(k)});if(q.get('cmp')==='1')$('cmp').checked=true;draw()})();</script></body></html>
